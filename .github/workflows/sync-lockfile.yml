# Regenerates package-lock.json from package.json so the committed lockfile
# always stays in sync with the declared dependencies.
#
# This exists so the lockfile can be produced by npm itself on GitHub's runner
# instead of being transcribed by hand; it can be deleted once it has run.
name: Sync package-lock.json

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use the project's npm version
        run: npm install -g npm@11.19.0

      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only

      - name: Commit the lockfile when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already in sync"
          else
            git commit -m "chore: sync package-lock.json with package.json"
            git push
          fi
